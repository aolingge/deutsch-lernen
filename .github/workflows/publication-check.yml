name: Publication Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
      - name: Run privacy and Markdown checks
        shell: pwsh
        run: ./tools/publication-check.ps1 .
