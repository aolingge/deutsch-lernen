name: Publication Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run privacy and Markdown checks
        shell: pwsh
        run: ./tools/publication-check.ps1 .
